name: CI & Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python AI Service
        run: |
          python -m py_compile ai_model/app.py

      - name: Install & Validate Backend
        run: |
          cd backend
          npm ci
          node --check server.js

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

