<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" fill="none">
  <defs>
    <!-- Background Glow Gradients -->
    <radialGradient id="bannerGlow" cx="65%" cy="50%" r="55%" fx="65%" fy="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#1677FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00A6A6" stop-opacity="0" />
    </radialGradient>
    
    <linearGradient id="toothGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#1677FF" />
      <stop offset="100%" stop-color="#00A6A6" />
    </linearGradient>

    <linearGradient id="accentTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A6A6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="fadeMaskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Background -->
  <rect x="0" y="0" width="460" height="220" fill="url(#bannerGlow)" />

  <g opacity="0.92">
    <!-- Concentric AI Scanner Radar Rings -->
    <circle cx="310" cy="110" r="85" stroke="#1677FF" stroke-opacity="0.1" stroke-width="1.2" stroke-dasharray="4 6" />
    <circle cx="310" cy="110" r="68" stroke="#00D2FF" stroke-opacity="0.14" stroke-width="1.2" />
    <circle cx="310" cy="110" r="50" stroke="#00A6A6" stroke-opacity="0.12" stroke-dasharray="3 4" />

    <!-- Diagnostic Reticle Brackets (AI Intraoral Scan Target) -->
    <path d="M 235 50 L 220 50 L 220 65" stroke="#00D2FF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.45" />
    <path d="M 385 50 L 400 50 L 400 65" stroke="#00D2FF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.45" />
    <path d="M 235 170 L 220 170 L 220 155" stroke="#00D2FF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.45" />
    <path d="M 385 170 L 400 170 L 400 155" stroke="#00D2FF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.45" />

    <!-- Crosshair ticks -->
    <line x1="310" y1="18" x2="310" y2="28" stroke="#00D2FF" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="310" y1="192" x2="310" y2="202" stroke="#00D2FF" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="218" y1="110" x2="228" y2="110" stroke="#00D2FF" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="392" y1="110" x2="402" y2="110" stroke="#00D2FF" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Neural Network Synapse Lines -->
    <g stroke="url(#toothGradient)" stroke-opacity="0.28" stroke-width="1.4">
      <line x1="180" y1="110" x2="225" y2="85" />
      <line x1="225" y1="85" x2="265" y2="110" />
      <line x1="225" y1="85" x2="255" y2="55" />
      <line x1="255" y1="55" x2="310" y2="40" />
      <line x1="310" y1="40" x2="365" y2="55" />
      <line x1="365" y1="55" x2="395" y2="85" />
      <line x1="365" y1="55" x2="355" y2="110" />
      <line x1="265" y1="110" x2="285" y2="165" />
      <line x1="355" y1="110" x2="335" y2="165" />
      <line x1="285" y1="165" x2="310" y2="180" />
      <line x1="335" y1="165" x2="310" y2="180" />
      <line x1="395" y1="85" x2="430" y2="110" />
    </g>

    <!-- Holographic 3D Tooth Geometry -->
    <g transform="translate(310, 110)">
      <!-- Outer Tooth Contour -->
      <path d="M 0 -52 C -24 -68, -54 -62, -50 -32 C -46 -10, -36 18, -30 42 C -27 54, -14 54, -9 40 C -4 26, 0 16, 0 16 C 0 16, 4 26, 9 40 C 14 54, 27 54, 30 42 C 36 18, 46 -10, 50 -32 C 54 -62, 24 -68, 0 -52 Z" 
            stroke="url(#toothGradient)" stroke-width="2.6" fill="rgba(255, 255, 255, 0.25)" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>

      <!-- Inner Enamel & Dentin Ridge Lines -->
      <path d="M -30 -28 C -18 -36, 18 -36, 30 -28" stroke="#00D2FF" stroke-width="1.8" stroke-opacity="0.6" stroke-linecap="round" fill="none"/>
      <path d="M -22 -10 C -12 -16, 12 -16, 22 -10" stroke="#00A6A6" stroke-width="1.4" stroke-opacity="0.5" stroke-linecap="round" fill="none"/>
      <path d="M 0 -48 L 0 8" stroke="#1677FF" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="2 3"/>

      <!-- Pulse Root Canals -->
      <path d="M -16 12 C -18 24, -20 36, -20 44" stroke="#00D2FF" stroke-width="1.4" stroke-opacity="0.5" stroke-linecap="round"/>
      <path d="M 16 12 C 18 24, 20 36, 20 44" stroke="#00D2FF" stroke-width="1.4" stroke-opacity="0.5" stroke-linecap="round"/>

      <!-- Center AI Micro-Core -->
      <circle cx="0" cy="-8" r="6" fill="#00D2FF" fill-opacity="0.25" stroke="#00D2FF" stroke-width="1.5" />
      <circle cx="0" cy="-8" r="2.5" fill="#FFFFFF" />
    </g>

    <!-- AI Synapse Nodes with Glowing Halos -->
    <circle cx="180" cy="110" r="3" fill="#1677FF" />
    <circle cx="225" cy="85" r="3.5" fill="#00D2FF" />
    <circle cx="255" cy="55" r="4" fill="#00A6A6" />
    <circle cx="310" cy="40" r="4.5" fill="#00D2FF" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="365" cy="55" r="4" fill="#00A6A6" />
    <circle cx="395" cy="85" r="3.5" fill="#00D2FF" />
    <circle cx="430" cy="110" r="3" fill="#1677FF" />
    <circle cx="285" cy="165" r="3.5" fill="#1677FF" />
    <circle cx="335" cy="165" r="3.5" fill="#00A6A6" />
    <circle cx="310" cy="180" r="4" fill="#00D2FF" stroke="#FFFFFF" stroke-width="1"/>

    <!-- Subtle Data Sparks -->
    <path d="M 235 32 Q 235 37 240 37 Q 235 37 235 42 Q 235 37 230 37 Q 235 37 235 32 Z" fill="#00D2FF" fill-opacity="0.6"/>
    <path d="M 385 140 Q 385 144 389 144 Q 385 144 385 148 Q 385 144 381 144 Q 385 144 385 140 Z" fill="#00A6A6" fill-opacity="0.6"/>
    <path d="M 205 130 Q 205 133 208 133 Q 205 133 205 136 Q 205 133 202 133 Q 205 133 205 130 Z" fill="#1677FF" fill-opacity="0.5"/>

    <!-- AI Scan Wave Horizon -->
    <path d="M 160 110 Q 230 90 310 110 T 460 110" stroke="url(#accentTeal)" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 4"/>
  </g>
</svg>
